# Supabase's free plan pauses a project after ~7 days without activity.
# This reads one row twice a week so the project never goes idle.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * 1,4' # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          set -a; . ./.env; set +a
          curl --fail --silent --show-error \
            "$REACT_APP_SUPABASE_URL/rest/v1/site_content?select=section&limit=1" \
            -H "apikey: $REACT_APP_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $REACT_APP_SUPABASE_ANON_KEY"
